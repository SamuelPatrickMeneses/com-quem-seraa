services:

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      target: production
    depends_on:
      pocketbase:
        condition: service_healthy
    environment:
      - PB_DASHBOARD_ENABLED=false

  pocketbase:
    build:
      context: ./db
      dockerfile: Dockerfile
    restart: unless-stopped
    volumes:
      - pocketbase_data:/app/pb_data
    env_file:
      - .env

volumes:
  pocketbase_data:
